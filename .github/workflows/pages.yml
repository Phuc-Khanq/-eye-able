# Publishes the website (diseyeble-frontend/diseyeble-frontend) to GitHub Pages:
#   https://phuc-khanq.github.io/diseyeble/   (landing page)   ...#demo (the live demo page)
# One-time setup by a repo admin: GitHub -> Settings -> Pages -> Source: "GitHub Actions".
# It runs on every push to the branches below, or by hand (Actions -> Publish website -> Run workflow).
# Only the website folder is published: no engine code, no models.
name: Publish website

on:
  push:
    branches: [live, eyes, main]
    paths: ["diseyeble-frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: diseyeble-frontend/diseyeble-frontend
      - id: deployment
        uses: actions/deploy-pages@v4
